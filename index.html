<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Private Fund</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

:root{
    --bg:#f3f5f8;
    --surface:#ffffff;
    --surface-soft:#f8fafc;
    --border:#e1e6ec;
    --text:#18212b;
    --muted:#75808d;
    --accent:#4f6df5;
    --accent-soft:#eef1ff;
    --green:#19a974;
    --green-soft:#eaf8f2;
    --red:#dc4c5b;
    --red-soft:#fff0f2;
    --orange:#c98722;
    --orange-soft:#fff7e8;
    --shadow:0 5px 18px rgba(25,35,50,.055);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
    margin:0;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
    padding-bottom:86px;
    background:
        radial-gradient(circle at 50% -180px,rgba(79,109,245,.09),transparent 430px),
        var(--bg);
}

.container{
    width:min(100%,760px);
    margin:0 auto;
    padding:22px 15px 30px;
}

h1{
    margin:6px 0 20px;
    font-size:27px;
    line-height:1.15;
    letter-spacing:-.65px;
}

h2{
    margin:0 0 15px;
    font-size:20px;
    letter-spacing:-.3px;
}

h3{margin:0 0 8px;font-size:16px}

.small{
    color:var(--muted);
    font-size:12.5px;
    line-height:1.45;
}

.amount{
    margin-top:3px;
    font-size:27px;
    line-height:1.15;
    font-weight:800;
    letter-spacing:-.55px;
    font-variant-numeric:tabular-nums;
}

.card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:17px;
    padding:16px;
    margin-bottom:12px;
    box-shadow:var(--shadow);
}

hr{
    border:0;
    border-top:1px solid #edf0f3;
    margin:15px 0;
}

.row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

button{
    width:100%;
    min-height:44px;
    margin-top:8px;
    padding:10px 13px;
    border:1px solid #dce2e8;
    border-radius:12px;
    background:#f7f9fb;
    color:#33404d;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
}

button:active{transform:scale(.988)}

button.green{
    color:white;
    border-color:#18a370;
    background:linear-gradient(180deg,#22b982,#18a36f);
}

button.danger{
    color:var(--red);
    border-color:#ffd4d9;
    background:var(--red-soft);
}

button.secondary{
    color:#5f6b78;
    background:white;
    border-color:#dfe4e9;
}

input,select,textarea{
    width:100%;
    min-height:47px;
    margin:6px 0 11px;
    padding:11px 12px;
    border:1px solid #d9e0e7;
    border-radius:11px;
    outline:none;
    background:#fff;
    color:var(--text);
    font:inherit;
    font-size:16px;
}

input:focus,select:focus,textarea:focus{
    border-color:#8ea0fa;
    box-shadow:0 0 0 3px rgba(79,109,245,.09);
}

input:disabled{
    background:#f3f5f7;
    color:#7c8793;
}

label{
    display:block;
    margin-top:6px;
    color:#52606d;
    font-size:13px;
    font-weight:650;
}

.status{
    margin-top:9px;
    padding:10px 11px;
    border:1px solid var(--border);
    border-radius:11px;
    background:var(--surface-soft);
    font-size:13px;
}

.status.success{
    color:#157955;
    border-color:#cdeee0;
    background:var(--green-soft);
}

.status.warning{
    color:#93631c;
    border-color:#f2dfb9;
    background:var(--orange-soft);
}

.status.error{
    color:#b43c49;
    border-color:#ffd1d6;
    background:var(--red-soft);
}

/* Modal remains visually separate from the page */
.modal{
    position:fixed;
    inset:0;
    z-index:1000;
    align-items:flex-end;
    justify-content:center;
    padding:14px;
    background:rgba(24,33,43,.38);
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
}


.modal-content{
    width:min(100%,620px);
    max-height:88vh;
    overflow:auto;
    padding:19px;
    border-radius:20px;
    border:1px solid #e0e5eb;
    background:white;
    color:var(--text);
    box-shadow:0 22px 60px rgba(28,39,52,.18);
}

/* Keep Fund / Projects / History clearly separated like the old version */
.nav,.bottom-nav{
    position:fixed;
    left:50%;
    bottom:10px;
    transform:translateX(-50%);
    width:min(calc(100% - 20px),720px);
    z-index:100;
    display:flex;
    gap:5px;
    padding:6px;
    border:1px solid #dde3e9;
    border-radius:17px;
    background:rgba(255,255,255,.94);
    box-shadow:0 8px 28px rgba(35,45,58,.11);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
}

.nav button,.bottom-nav button{
    flex:1;
    min-height:48px;
    margin:0;
    padding:7px 5px;
    border:0;
    border-radius:11px;
    background:transparent;
    color:#77828e;
    font-size:12px;
}

.nav button.active,.bottom-nav button.active,.bottom-nav .active{
    color:#3f5be1;
    background:var(--accent-soft);
}

/* Coin / project details */
.coin{
    display:flex;
    align-items:center;
    gap:9px;
}

.coin::before{
    content:"";
    width:8px;
    height:8px;
    flex:0 0 8px;
    border-radius:50%;
    background:#627af2;
}

/* Project cards get a very subtle distinction, not a dark theme */
.project-card,#projects .card{
    border-left:3px solid #d7defd;
}

/* Make action groups easier to scan */
.card button.green{
    margin-top:11px;
}

@media (hover:hover) and (pointer:fine){
    button:hover{
        border-color:#c9d1d9;
        background:#f1f4f7;
    }
    button.green:hover{
        background:#18a974;
        color:white;
    }
}

@media(max-width:420px){
    .container{padding-left:11px;padding-right:11px}
    h1{font-size:24px}
    .amount{font-size:24px}
    .card{padding:14px;border-radius:15px}
    button{font-size:13px}
}


/* TOP TABS: Фонд / Проекты / История */
body .container > nav{
    position:sticky;
    top:8px;
    z-index:90;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    width:100%;
    margin:0 0 18px;
    padding:6px;
    border:1px solid #dde3e9;
    border-radius:16px;
    background:rgba(255,255,255,.95);
    box-shadow:0 5px 20px rgba(35,45,58,.08);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
}

body .container > nav button{
    width:auto;
    min-height:45px;
    margin:0;
    padding:8px 6px;
    border:0;
    border-radius:11px;
    background:transparent;
    color:#77828e;
    font-size:13px;
}

body .container > nav button.active{
    background:#eef1ff;
    color:#3f5be1;
}

/* Only one main page is visible at a time */
#pageFund,
#pageProjects,
#pageHistory{
    display:none;
}

#pageFund.active-page,
#pageProjects.active-page,
#pageHistory.active-page{
    display:block;
}


.hidden{display:none !important;}
.modal:not(.hidden){display:flex;}
</style>
</head>

<body>

<div class="container">

<h1>🏦 Private Fund</h1>

<nav>
    <button type="button" id="navFund" class="active" onclick="showPage('fund')">🏦 Фонд</button>
    <button type="button" id="navProjects" onclick="showPage('projects')">📊 Проекты</button>
    <button type="button" id="navHistory" onclick="showPage('history')">📜 История</button>
</nav>

<!-- ФОНД -->
<div id="pageFund">

    <div class="card">
        <div class="row">
            <div>
                <h2>💰 Фонд</h2>
                <div class="small">Текущие средства</div>
            </div>
            <button type="button" onclick="openDeposit()">＋ Поступление</button>
        </div>

        <div id="fundCoins"></div>
    </div>

    <!-- НОВОЕ: СПИСОК ПОСТУПЛЕНИЙ -->
    <div class="card">
        <h2>📥 Поступления</h2>
        <div class="small">Здесь можно изменить или удалить отдельное поступление.</div>
        <div id="depositsList"></div>
    </div>

    <div class="card">
        <h2>💸 К выводу</h2>
        <div id="withdrawals"></div>
    </div>

</div>

<!-- ПРОЕКТЫ -->
<div id="pageProjects" class="hidden">

    <div class="card">
        <div class="row">
            <div>
                <h2>📊 Проекты</h2>
                <div class="small">Распределение фонда</div>
            </div>
            <button type="button" onclick="openProject()">＋ Проект</button>
        </div>

        <div id="percentTotal"></div>
    </div>

    <div id="projectsList"></div>

</div>

<!-- ИСТОРИЯ -->
<div id="pageHistory" class="hidden">

    <div class="card">
        <h2>📜 История</h2>
        <div id="historyList"></div>
    </div>

</div>

<!-- MODAL -->
<div id="modal" class="modal hidden" style="display:none">
    <div class="modal-box">
        <button class="close" onclick="closeModal()">✕</button>
        <div id="modalContent"></div>
    </div>
</div>

<script>

/* =========================
   ДАННЫЕ
========================= */

let data = JSON.parse(localStorage.getItem("privateFundData")) || {
    coins: [],
    projects: [],
    withdrawals: [],
    deposits: [],
    history: []
};

/* Совместимость со старой версией */
if (!Array.isArray(data.coins)) data.coins = [];
if (!Array.isArray(data.projects)) data.projects = [];
if (!Array.isArray(data.withdrawals)) data.withdrawals = [];
if (!Array.isArray(data.deposits)) data.deposits = [];
if (!Array.isArray(data.history)) data.history = [];
if (!Array.isArray(data.operations)) data.operations = [];

/* Совместимость: отдельная монета/актив внутри проекта */
data.projects.forEach(p => {
    if (!p.assetName) p.assetName = "";
    if (!Number.isFinite(Number(p.assetAvailable))) p.assetAvailable = 0;
    if (!Number.isFinite(Number(p.assetInvested))) p.assetInvested = 0;
});

function save() {
    localStorage.setItem("privateFundData", JSON.stringify(data));
}

/* =========================
   ОДНОРАЗОВОЕ УДАЛЕНИЕ СТАРЫХ 1000 AXM
   Удаляет старый баланс 1000 AXM, который был
   добавлен до появления журнала поступлений.
========================= */
if (!localStorage.getItem("old1000Removed")) {
    const axm = data.coins.find(c => c.name.toLowerCase() === "axm");
    if (axm && Number(axm.balance) === 1000) {
        axm.balance = 0;

        // Убираем также старые доступные средства проектов AXM.
        data.projects.forEach(p => {
            if (p.coinId === axm.id) {
                p.available = 0;
            }
        });

        localStorage.setItem("old1000Removed", "1");
        save();
    }
}

/* =========================
   TELEGRAM
========================= */

if (window.Telegram && Telegram.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
}

/* =========================
   НАВИГАЦИЯ
========================= */

function showPage(page) {

    const pages = {
        fund: document.getElementById("pageFund"),
        projects: document.getElementById("pageProjects"),
        history: document.getElementById("pageHistory")
    };

    const navs = {
        fund: document.getElementById("navFund"),
        projects: document.getElementById("navProjects"),
        history: document.getElementById("navHistory")
    };

    Object.values(pages).forEach(el => {
        if (el) el.classList.remove("active-page");
    });

    Object.values(navs).forEach(el => {
        if (el) el.classList.remove("active");
    });

    if (pages[page]) pages[page].classList.add("active-page");
    if (navs[page]) navs[page].classList.add("active");

    window.scrollTo({ top: 0, behavior: "smooth" });
}

/* =========================
   ВСПОМОГАТЕЛЬНОЕ
========================= */

function money(n) {
    return Number(n || 0).toLocaleString("ru-RU", {
        maximumFractionDigits: 8
    });
}

function dateNow() {
    return new Date().toLocaleString("ru-RU");
}

function getCoin(id) {
    return data.coins.find(c => c.id === id);
}

function getProject(id) {
    return data.projects.find(p => p.id === id);
}

function addHistory(type, text) {
    data.history.unshift({
        id: Date.now().toString(),
        type,
        text,
        date: dateNow()
    });
}

/*
   Распределение поступления между проектами.
   ВАЖНО: сохраняем распределение внутри самого поступления.
   Поэтому изменение процентов проектов в будущем не меняет
   старые поступления.
*/
function makeDepositAllocations(coinId, amount) {

    const projects = data.projects.filter(p => p.coinId === coinId);

    return projects.map(p => ({
        projectId: p.id,
        amount: amount * (Number(p.percent) / 100)
    }));
}

function applyDepositAllocation(allocations, multiplier) {

    allocations.forEach(a => {
        const project = getProject(a.projectId);

        if (project) {
            project.available += Number(a.amount) * multiplier;
        }
    });
}

/* =========================
   ФОНД
========================= */

function renderFund() {

    const box = document.getElementById("fundCoins");

    if (!data.coins.length) {
        box.innerHTML = `
            <div class="empty">
                Пока нет монет.<br>
                Добавь первую монету через «Поступление».
            </div>
        `;
        return;
    }

    box.innerHTML = data.coins.map(c => {

        return `
        <div class="coin-card">
            <div class="row">
                <div>
                    <b>🪙 ${escapeHtml(c.name)}</b>
                    <div class="small">Баланс фонда</div>
                </div>

                <div class="amount">${money(c.balance)}</div>
            </div>
            <button class="secondary" onclick="openEditCoinBalance('${c.id}')">
                ✏️ Изменить баланс
            </button>
        </div>
        `;

    }).join("");
}

/* =========================
   СПИСОК ПОСТУПЛЕНИЙ
========================= */


/* РУЧНАЯ КОРРЕКТИРОВКА БАЛАНСА ФОНДА
   Не меняет поступления, проценты, allocations или available проектов. */
function openEditCoinBalance(coinId) {
    const coin = getCoin(coinId);
    if (!coin) return alert("Монета не найдена.");

    document.getElementById("modalContent").innerHTML = `
        <h2>✏️ Изменить баланс ${escapeHtml(coin.name)}</h2>
        <div class="status warning">
            Меняется только общий баланс фонда.<br>
            Поступления и распределение проектов не изменятся.
        </div>
        <label>Новый баланс ${escapeHtml(coin.name)}</label>
        <input id="manualCoinBalance" type="number" step="any" min="0" value="${coin.balance}">
        <button class="green" onclick="setCoinBalance('${coinId}')">💾 Сохранить баланс</button>
    `;
    openModal();
}

function setCoinBalance(coinId) {
    const coin = getCoin(coinId);
    if (!coin) return alert("Монета не найдена.");

    const newBalance = Number(document.getElementById("manualCoinBalance").value);
    if (!Number.isFinite(newBalance) || newBalance < 0) {
        alert("Введите корректный баланс.");
        return;
    }

    const oldBalance = Number(coin.balance || 0);

    if (!confirm(
        `Изменить баланс ${coin.name}: ${money(oldBalance)} → ${money(newBalance)}?\n\n` +
        `Доступные средства проектов и распределение останутся без изменений.`
    )) return;

    coin.balance = newBalance;

    addHistory(
        "balance",
        `Ручная корректировка баланса фонда ${coin.name}: ${money(oldBalance)} → ${money(newBalance)}. ` +
        `Распределение проектов не изменено.`
    );

    save();
    closeModal();
    render();
}

function renderDeposits() {

    const box = document.getElementById("depositsList");

    if (!data.deposits.length) {
        box.innerHTML = `
            <div class="empty">
                Поступлений пока нет.
            </div>
        `;
        return;
    }

    box.innerHTML = [...data.deposits]
        .reverse()
        .map(d => {

            const coin = getCoin(d.coinId);

            return `
            <div class="deposit-item">

                <div class="row">
                    <div>
                        <b>📥 ${coin ? escapeHtml(coin.name) : "Монета удалена"}</b>
                        <div class="small">${escapeHtml(d.date)}</div>
                    </div>

                    <div class="amount plus">
                        +${money(d.amount)}
                    </div>
                </div>

                <div class="deposit-actions">

                    <button onclick="openEditDeposit('${d.id}')">
                        ✏️ Изменить
                    </button>

                    <button class="danger" onclick="deleteDeposit('${d.id}')">
                        🗑 Удалить
                    </button>

                </div>

            </div>
            `;

        }).join("");
}

/* =========================
   ПОСТУПЛЕНИЕ
========================= */

function openDeposit() {

    let coinOptions = data.coins.map(c =>
        `<option value="${c.id}">${escapeHtml(c.name)}</option>`
    ).join("");

    document.getElementById("modalContent").innerHTML = `

        <h2>📥 Поступление</h2>

        ${
            data.coins.length
            ?
            `
            <label>Монета</label>
            <select id="depositCoin">
                ${coinOptions}
            </select>

            <label>Количество</label>
            <input id="depositAmount"
                type="number"
                step="any"
                min="0"
                placeholder="Например: 1000">

            <button onclick="deposit()">Добавить поступление</button>
            `
            :
            `
            <div class="status warning">
                Сначала нужно создать монету.
            </div>
            `
        }

        <hr>

        <button class="secondary" onclick="openCoin()">
            ＋ Добавить новую монету
        </button>
    `;

    openModal();
}

function deposit() {

    const coinId = document.getElementById("depositCoin").value;
    const amount = Number(document.getElementById("depositAmount").value);

    if (!coinId || !amount || amount <= 0) {
        alert("Введите корректную сумму.");
        return;
    }

    const coin = getCoin(coinId);

    if (!coin) {
        alert("Монета не найдена.");
        return;
    }

    const allocations = makeDepositAllocations(coinId, amount);

    coin.balance += amount;

    applyDepositAllocation(allocations, 1);

    const depositRecord = {
        id: Date.now().toString(),
        coinId: coinId,
        amount: amount,
        date: dateNow(),
        allocations: allocations
    };

    data.deposits.push(depositRecord);

    addHistory(
        "deposit",
        `Поступление +${money(amount)} ${coin.name}`
    );

    save();
    closeModal();
    render();
}

/* =========================
   ИЗМЕНЕНИЕ ПОСТУПЛЕНИЯ
========================= */

function openEditDeposit(id) {

    const d = data.deposits.find(x => x.id === id);

    if (!d) {
        alert("Поступление не найдено.");
        return;
    }

    const coin = getCoin(d.coinId);

    if (!coin) {
        alert("Монета этого поступления не найдена.");
        return;
    }

    document.getElementById("modalContent").innerHTML = `

        <h2>✏️ Изменить поступление</h2>

        <p>
            Монета: <b>${escapeHtml(coin.name)}</b><br>
            Текущая сумма: <b>${money(d.amount)} ${escapeHtml(coin.name)}</b>
        </p>

        <label>Новая сумма</label>

        <input id="editDepositAmount"
            type="number"
            step="any"
            min="0"
            value="${d.amount}">

        <div class="small">
            Проекты получат изменение пропорционально распределению,
            которое было сохранено у этого поступления.
        </div>

        <button class="green" onclick="editDeposit('${id}')">
            💾 Сохранить изменения
        </button>

        <button class="danger" onclick="deleteDeposit('${id}')">
            🗑 Удалить поступление
        </button>
    `;

    openModal();
}

function editDeposit(id) {

    const d = data.deposits.find(x => x.id === id);

    if (!d) {
        alert("Поступление не найдено.");
        return;
    }

    const coin = getCoin(d.coinId);

    const newAmount = Number(
        document.getElementById("editDepositAmount").value
    );

    if (!newAmount || newAmount <= 0) {
        alert("Введите корректную сумму.");
        return;
    }

    const oldAmount = Number(d.amount);
    const difference = newAmount - oldAmount;

    /*
       Не позволяем изменить поступление так,
       чтобы баланс фонда стал отрицательным.
    */
    if (coin.balance + difference < -0.00000001) {
        alert(
            "Нельзя уменьшить поступление настолько: " +
            "в фонде недостаточно средств."
        );
        return;
    }

    /*
       Изменяем баланс фонда.
    */
    coin.balance += difference;

    /*
       Изменяем доступные средства проектов.
       Используем сохранённые доли именно этого поступления.
    */
    if (oldAmount > 0 && Array.isArray(d.allocations)) {

        d.allocations.forEach(a => {

            const project = getProject(a.projectId);

            if (!project) return;

            const share = Number(a.amount) / oldAmount;

            project.available += difference * share;

            if (project.available < -0.00000001) {
                project.available = 0;
            }

            a.amount = newAmount * share;
        });

    } else {

        /*
           Запасной вариант для старых записей.
        */
        const newAllocations = makeDepositAllocations(
            d.coinId,
            newAmount
        );

        applyDepositAllocation(
            newAllocations,
            1
        );

        d.allocations = newAllocations;
    }

    d.amount = newAmount;

    addHistory(
        "deposit",
        `Изменено поступление: ${money(oldAmount)} → ${money(newAmount)} ${coin.name}`
    );

    save();
    closeModal();
    render();
}

/* =========================
   УДАЛЕНИЕ ПОСТУПЛЕНИЯ
========================= */

function deleteDeposit(id) {

    const d = data.deposits.find(x => x.id === id);

    if (!d) {
        alert("Поступление не найдено.");
        return;
    }

    const coin = getCoin(d.coinId);

    if (!coin) {
        alert("Монета этого поступления не найдена.");
        return;
    }

    const amount = Number(d.amount);

    if (!confirm(
        `Удалить поступление ${money(amount)} ${coin.name}?\n\n` +
        `Баланс фонда и доступные средства проектов будут уменьшены.`
    )) {
        return;
    }

    /*
       Если часть средств уже была инвестирована,
       после удаления может возникнуть отрицательное доступное
       значение проекта. Поэтому проверяем это заранее.
    */
    if (Array.isArray(d.allocations)) {

        for (const a of d.allocations) {

            const project = getProject(a.projectId);

            if (
                project &&
                project.available - Number(a.amount) < -0.00000001
            ) {
                alert(
                    `Нельзя удалить это поступление.\n\n` +
                    `У проекта "${project.name}" часть этих средств ` +
                    `уже недоступна (вероятно, она была инвестирована).\n\n` +
                    `Сначала нужно отменить соответствующую инвестицию.`
                );
                return;
            }
        }

    } else {

        if (coin.balance - amount < -0.00000001) {
            alert("Нельзя удалить поступление: в фонде недостаточно средств.");
            return;
        }
    }

    coin.balance -= amount;

    if (Array.isArray(d.allocations)) {
        applyDepositAllocation(d.allocations, -1);
    }

    data.deposits = data.deposits.filter(x => x.id !== id);

    addHistory(
        "deposit",
        `Удалено поступление: -${money(amount)} ${coin.name}`
    );

    save();
    closeModal();
    render();
}

function renderProjects() {

    const list = document.getElementById("projectsList");

    if (!data.projects.length) {
        list.innerHTML = `
            <div class="card empty">
                Пока нет проектов.<br>
                Нажми «＋ Проект», чтобы создать первый.
            </div>
        `;

        document.getElementById("percentTotal").innerHTML = "";
        return;
    }

    /*
       Проценты показываем отдельно по каждой монете.
       Раньше здесь считались проценты всех монет вместе,
       что могло давать неправильный результат.
    */

    const coinsWithProjects = [...new Set(
        data.projects.map(p => p.coinId)
    )];

    let percentHtml = "";

    coinsWithProjects.forEach(coinId => {

        const coin = getCoin(coinId);
        const projects = data.projects.filter(p => p.coinId === coinId);

        const total = projects.reduce(
            (sum, p) => sum + Number(p.percent),
            0
        );

        let statusClass = "success";
        let statusText = "100% — распределение корректное";

        if (Math.abs(total - 100) > 0.000001) {

            statusClass = "error";

            if (total > 100) {
                statusText =
                    `${money(total)}% — превышение на ${money(total - 100)}%`;
            } else {
                statusText =
                    `${money(total)}% — не хватает ${money(100 - total)}%`;
            }
        }

        percentHtml += `
            <div class="status ${statusClass}">
                ${coin ? escapeHtml(coin.name) : "Монета"}:
                <b>${money(total)}%</b><br>
                ${statusText}
            </div>
        `;
    });

    document.getElementById("percentTotal").innerHTML = percentHtml;

    list.innerHTML = data.projects.map(p => {

        const coin = getCoin(p.coinId);

        return `
        <div class="card project-card">

            <div class="row">
                <div>
                    <h2>📁 ${escapeHtml(p.name)}</h2>
                    <div class="small">
                        ${coin ? escapeHtml(coin.name) : "Монета удалена"}
                    </div>
                </div>

                <b>${money(p.percent)}%</b>
            </div>

            <hr>

            <div class="row">
                <div>
                    <div class="small">Доступно для инвестирования</div>
                    <div class="amount">
                        ${money(p.available)} ${coin ? escapeHtml(coin.name) : ""}
                    </div>
                </div>
            </div>

            <div style="margin-top:12px">
                <div class="small">Всего инвестировано из фонда</div>
                <b>${money(p.invested)} ${coin ? escapeHtml(coin.name) : ""}</b>
            </div>

            <hr>

            <div>
                <div class="small">Актив проекта после обмена</div>
                ${
                    p.assetName
                    ? `
                        <div class="amount">
                            ${money(p.assetAvailable)} ${escapeHtml(p.assetName)}
                        </div>
                        <div class="small">
                            В работе / инвестировано: ${money(p.assetInvested)} ${escapeHtml(p.assetName)}
                        </div>
                    `
                    : `<div class="small">Пока не выбран. Можно обменять доступные ${coin ? escapeHtml(coin.name) : ""} на монету проекта.</div>`
                }
            </div>

            ${
                p.assetName && getPendingExitAmount(p) > 0.00000001
                ? `
                    <div class="status warning">
                        К обмену для вывода:
                        <b>${money(getPendingExitAmount(p))} ${escapeHtml(p.assetName)}</b>
                    </div>

                    <button onclick="openExitExchange('${p.id}')">
                        🔁 Обменять прибыль ${escapeHtml(p.assetName)} → ${coin ? escapeHtml(coin.name) : ""}
                    </button>
                `
                : ""
            }

            <button onclick="openExchangeToAsset('${p.id}')">
                🔄 Обменять монету
            </button>

            <button onclick="openManualProjectInvestment('${p.id}')">
                ➕ Добавить инвестицию вручную
            </button>

            <button onclick="openAdjustProjectInvestment('${p.id}')">
                ✏️ Исправить инвестированное
            </button>

            ${renderProjectOperations(p.id)}

            ${
                p.assetName
                ? `
                    <button class="green" onclick="openInvestAsset('${p.id}')">
                        📤 Инвестировать ${escapeHtml(p.assetName)}
                    </button>

                    <button onclick="openProfit('${p.id}')">
                        📈 Добавить прибыль в ${escapeHtml(p.assetName)}
                    </button>
                `
                : `
                    <button class="green" onclick="openInvest('${p.id}')">
                        📤 Инвестировать ${coin ? escapeHtml(coin.name) : ""}
                    </button>

                    <button onclick="openProfit('${p.id}')">
                        📈 Добавить прибыль
                    </button>
                `
            }

            <button class="secondary" onclick="openProject('${p.id}')">

function openProject(id = null) {

    const project = id ? getProject(id) : null;

    let coinOptions = data.coins.map(c => `

    `).join("");

    document.getElementById("modalContent").innerHTML = `

            ?
            `
            <div class="status warning">
                Сначала нужно создать монету.
            </div>

            <button onclick="openCoin()">＋ Создать монету</button>
            `
            :
            `
            <label>Название проекта</label>

            <label>Монета</label>

                ${coinOptions}
            </select>

            <label>Процент распределения</label>

                step="0.01"

            </div>

    // но само окно не открывалось. Поэтому кнопки "＋ Проект"
    // и "✏️ Изменить" визуально нажимались, но ничего не происходило.

}

function saveProject(id) {

    const name = document.getElementById("projectName").value.trim();
    const coinId = document.getElementById("projectCoin").value;
    const percent = Number(document.getElementById("projectPercent").value);

    if (!name || !coinId || !Number.isFinite(percent) || percent < 0 || percent > 100) {
        alert("Заполни все поля. Процент должен быть от 0 до 100.");
        return;
    }

    const otherProjects = data.projects.filter(
        p => p.coinId === coinId && p.id !== id
    );

    const otherTotal = otherProjects.reduce(
        (sum, p) => sum + Number(p.percent),
        0
    );

    const total = otherTotal + percent;

    /*
       Если после создания/изменения проекта сумма становится больше 100%,
       не блокируем действие. Открываем экран перераспределения, где
       пользователь сам выбирает, у каких проектов уменьшить процент.
    */
    if (total > 100.000001) {
        openProjectRedistribution(id, name, coinId, percent);
        return;
    }

    commitProject(id, name, coinId, percent);
}


function commitProject(id, name, coinId, percent) {

    if (id) {

        const project = getProject(id);

        if (!project) {
            alert("Проект не найден.");
            return;
        }

        project.name = name;
        project.coinId = coinId;
        project.percent = percent;

    } else {

        data.projects.push({
            id: Date.now().toString(),
            name,
            coinId,
            percent,
            available: 0,
            invested: 0,
            assetName: "",
            assetAvailable: 0,
            assetInvested: 0
        });
    }

    addHistory(
        "project",
        `${id ? "Изменён" : "Создан"} проект: ${name} — ${money(percent)}%`
    );

    save();
    closeModal();
    render();
}


function openProjectRedistribution(id, name, coinId, percent) {

    const coin = getCoin(coinId);

    const otherProjects = data.projects.filter(
        p => p.coinId === coinId && p.id !== id
    );

    const otherTotal = otherProjects.reduce(
        (sum, p) => sum + Number(p.percent),
        0
    );

    const total = otherTotal + percent;
    const excess = total - 100;

    const rows = otherProjects.map(p => `
        <div class="coin-card">
            <div class="row">
                <div>
                    <b>${escapeHtml(p.name)}</b>
                    <div class="small">Сейчас: ${money(p.percent)}%</div>
                </div>
                <div style="width:130px">
                    <label>Новый %</label>
                    <input
                        class="redistributePercent"
                        data-project-id="${p.id}"
                        type="number"
                        step="0.01"
                        min="0"
                        max="100"
                        value="${p.percent}"
                        oninput="updateRedistributionTotal('${id || ""}', ${percent})">
                </div>
            </div>
        </div>
    `).join("");

    document.getElementById("modalContent").innerHTML = `
        <h2>⚖️ Перераспределить проценты</h2>

        <div class="status warning">
            ${coin ? escapeHtml(coin.name) : "Монета"} уже распределена.
            После добавления получится <b>${money(total)}%</b>.<br>
            Нужно уменьшить другие проекты минимум на
            <b>${money(excess)}%</b>, чтобы итог снова был ровно 100%.
        </div>

        <div style="margin-top:14px">
            <b>Новый / изменяемый проект</b>
            <div class="coin-card">
                <div class="row">
                    <span>${escapeHtml(name)}</span>
                    <b>${money(percent)}%</b>
                </div>
            </div>
        </div>

        <div style="margin-top:14px">
            <b>Выбери, где уменьшить процент:</b>
            <div class="small">
                Можно уменьшить один проект или сразу несколько.
            </div>
            ${rows}
        </div>

        <div id="redistributionTotal" class="status error"></div>

        <button class="green"
            onclick="applyProjectRedistribution('${id || ""}', '${escapeJs(name)}', '${coinId}', ${percent})">
            💾 Применить и сохранить
        </button>

        <button class="secondary"
            onclick="openProject('${id || ""}')">
            ← Назад
        </button>
    `;

    updateRedistributionTotal(id || "", percent);
}


function updateRedistributionTotal(id, newProjectPercent) {

    const inputs = [...document.querySelectorAll(".redistributePercent")];

    const otherTotal = inputs.reduce(
        (sum, input) => sum + Number(input.value || 0),
        0
    );

    const total = otherTotal + Number(newProjectPercent);

    const box = document.getElementById("redistributionTotal");

    if (!box) return;

    if (Math.abs(total - 100) <= 0.000001) {
        box.className = "status success";
        box.innerHTML = `Итого: <b>${money(total)}%</b> — можно сохранить.`;
    } else if (total > 100) {
        box.className = "status error";
        box.innerHTML =
            `Итого: <b>${money(total)}%</b>. ` +
            `Нужно уменьшить ещё на <b>${money(total - 100)}%</b>.`;
    } else {
        box.className = "status warning";
        box.innerHTML =
            `Итого: <b>${money(total)}%</b>. ` +
            `Нужно добавить ещё <b>${money(100 - total)}%</b>.`;
    }
}


function applyProjectRedistribution(id, name, coinId, newProjectPercent) {

    const inputs = [...document.querySelectorAll(".redistributePercent")];

    const changes = [];

    for (const input of inputs) {

        const value = Number(input.value);

        if (!Number.isFinite(value) || value < 0 || value > 100) {
            alert("Все проценты должны быть от 0 до 100.");
            return;
        }

        changes.push({
            projectId: input.dataset.projectId,
            percent: value
        });
    }

    const total =
        changes.reduce((sum, x) => sum + x.percent, 0) +
        Number(newProjectPercent);

    if (Math.abs(total - 100) > 0.000001) {
        alert(
            `Сумма должна быть ровно 100%.\n\n` +
            `Сейчас: ${money(total)}%`
        );
        return;
    }

    /*
       Меняем только проценты будущих распределений.
       Уже сохранённые поступления сохраняют свои старые allocations.
    */
    changes.forEach(change => {
        const project = getProject(change.projectId);
        if (project) {
            project.percent = change.percent;
        }
    });

    commitProject(
        id,
        name,
        coinId,
        Number(newProjectPercent)
    );
}


/*
   Экранируем строку для безопасной вставки в JS-аргумент onclick.
*/
function escapeJs(text) {
    return String(text)
        .replaceAll("\\", "\\\\")
        .replaceAll("'", "\\'")
        .replaceAll("\n", "\\n")
        .replaceAll("\r", "\\r");
}


/* =========================
   ОБМЕН СРЕДСТВ ФОНДА НА АКТИВ ПРОЕКТА
========================= */

function openExchangeToAsset(id) {

    const p = getProject(id);
    const baseCoin = getCoin(p.coinId);

    // Источники обмена: монета фонда проекта + текущий актив проекта,
    // если он есть и доступен.
    const sources = [];

    if (baseCoin && Number(p.available) > 0.00000001) {
        sources.push({
            key: "base",
            name: baseCoin.name,
            amount: Number(p.available)
        });
    }

    if (p.assetName && Number(p.assetAvailable) > 0.00000001) {
        sources.push({
            key: "asset",
            name: p.assetName,
            amount: Number(p.assetAvailable)
        });
    }

    if (!sources.length) {
        alert("В проекте сейчас нет доступных монет для обмена.");
        return;
    }

    // Список получаемых монет берём из всех уже существующих монет приложения.
    // Текущий актив проекта тоже добавляем в список, если его ещё нет в data.coins.
    const targetNames = [...new Set([
        ...data.coins.map(c => c.name),
        ...(p.assetName ? [p.assetName] : [])
    ].filter(Boolean))];

    const sourceOptions = sources.map(s => `
        <option value="${s.key}">
            ${escapeHtml(s.name)} — доступно ${money(s.amount)}
        </option>
    `).join("");

    const targetOptions = targetNames.map(name => `
        <option value="${escapeAttr(name)}">
            ${escapeHtml(name)}
        </option>
    `).join("");

    document.getElementById("modalContent").innerHTML = `
        <h2>🔄 Обмен монет проекта</h2>

        <p>
            <b>${escapeHtml(p.name)}</b>
        </p>

        <label>С какой монеты меняем?</label>
        <select id="exchangeFromCoin" onchange="updateExchangeAvailable('${id}')">
            ${sourceOptions}
        </select>

        <div id="exchangeAvailableInfo" class="status"></div>

        <label>Сколько отдаём?</label>
        <input id="exchangeFromAmount"
            type="number"
            step="any"
            min="0"
            placeholder="Например: 100">

        <label>На какую монету меняем?</label>
        <select id="exchangeToCoin">
            ${targetOptions}
        </select>

        <label>Сколько получили?</label>
        <input id="exchangeAssetAmount"
            type="number"
            step="any"
            min="0"
            placeholder="Например: 7.518433">

        <div class="small">
            Выбирай обе монеты из списка и указывай фактические суммы обмена.
        </div>

        <button class="green" onclick="exchangeProjectCoins('${id}')">
            💾 Записать обмен
        </button>
    `;

    openModal();
    updateExchangeAvailable(id);
}


function updateExchangeAvailable(id) {

    const p = getProject(id);
    const baseCoin = getCoin(p.coinId);
    const select = document.getElementById("exchangeFromCoin");
    const box = document.getElementById("exchangeAvailableInfo");
    const amountInput = document.getElementById("exchangeFromAmount");

    if (!select || !box) return;

    let name = "";
    let amount = 0;

    if (select.value === "base") {
        name = baseCoin ? baseCoin.name : "";
        amount = Number(p.available || 0);
    } else {
        name = p.assetName || "";
        amount = Number(p.assetAvailable || 0);
    }

    box.innerHTML = `Доступно для обмена: <b>${money(amount)} ${escapeHtml(name)}</b>`;

    if (amountInput) {
        amountInput.max = amount;
    }
}


function exchangeToAsset(id) {
    // Совместимость со старыми onclick, если где-то осталась ссылка.
    exchangeProjectCoins(id);
}


function exchangeProjectCoins(id) {

    const p = getProject(id);
    const baseCoin = getCoin(p.coinId);

    const fromType = document.getElementById("exchangeFromCoin").value;
    const fromAmount = Number(document.getElementById("exchangeFromAmount").value);
    const toCoinName = document.getElementById("exchangeToCoin").value.trim().toUpperCase();
    const toAmount = Number(document.getElementById("exchangeAssetAmount").value);

    let fromName = "";
    let available = 0;

    if (fromType === "base") {
        fromName = baseCoin.name;
        available = Number(p.available || 0);
    } else {
        fromName = p.assetName || "";
        available = Number(p.assetAvailable || 0);
    }

    if (!fromAmount || fromAmount <= 0 || !toCoinName || !toAmount || toAmount <= 0) {
        alert("Выбери обе монеты и укажи обе суммы обмена.");
        return;
    }

    if (fromName.toUpperCase() === toCoinName) {
        alert("Монета, которую отдаёшь, и монета, которую получаешь, должны отличаться.");
        return;
    }

    if (fromAmount > available + 0.00000001) {
        alert(`Недостаточно ${fromName}. Доступно: ${money(available)} ${fromName}.`);
        return;
    }

    // Получаем/создаём глобальную запись целевой монеты.
    let receivedCoin = data.coins.find(
        c => c.name.toLowerCase() === toCoinName.toLowerCase()
    );

    if (!receivedCoin) {
        receivedCoin = {
            id: (Date.now() + 1).toString(),
            name: toCoinName,
            balance: 0
        };
        data.coins.push(receivedCoin);
    }

    if (fromType === "base") {

        // Меняем выделенную проекту базовую монету (например AXM) на актив.
        p.available -= fromAmount;
        baseCoin.balance -= fromAmount;

        // Если в проекте уже есть другой актив с остатком, нельзя смешивать
        // две разные проектные монеты в одном assetAvailable.
        if (
            p.assetName &&
            p.assetName.toUpperCase() !== toCoinName &&
            (Number(p.assetAvailable) > 0.00000001 || Number(p.assetInvested) > 0.00000001)
        ) {
            // Откатываем списание до выхода.
            p.available += fromAmount;
            baseCoin.balance += fromAmount;

            alert(
                `В проекте уже используется ${p.assetName}.\n\n` +
                `Сначала обменяй доступный остаток ${p.assetName} назад или в другую монету.`
            );
            return;
        }

        p.assetName = toCoinName;
        p.assetAvailable = Number(p.assetAvailable || 0) + toAmount;
        receivedCoin.balance += toAmount;

    } else {

        // Меняем текущий актив проекта назад, например CLX → AXM,
        // либо на другую выбранную монету.
        const oldAssetName = p.assetName;
        const oldAssetCoin = data.coins.find(
            c => c.name.toLowerCase() === oldAssetName.toLowerCase()
        );

        p.assetAvailable -= fromAmount;

        if (oldAssetCoin) {
            oldAssetCoin.balance -= fromAmount;
            if (oldAssetCoin.balance < 0.00000001) oldAssetCoin.balance = 0;
        }

        receivedCoin.balance += toAmount;

        if (baseCoin && toCoinName === baseCoin.name.toUpperCase()) {
            // Обмен назад в базовую монету проекта:
            // она снова становится доступной для инвестирования проекта.
            p.available = Number(p.available || 0) + toAmount;

            // Если весь свободный актив обменян назад и ничего не инвестировано,
            // очищаем название проектного актива.
            if (
                Number(p.assetAvailable) <= 0.00000001 &&
                Number(p.assetInvested) <= 0.00000001
            ) {
                p.assetAvailable = 0;
                p.assetName = "";
            }
        } else {
            // Обмен актива на другую проектную монету.
            // Пока поддерживаем один свободный актив проекта за раз,
            // поэтому менять можно весь доступный остаток.
            if (Number(p.assetAvailable) > 0.00000001) {
                // Откат.
                p.assetAvailable += fromAmount;
                if (oldAssetCoin) oldAssetCoin.balance += fromAmount;
                receivedCoin.balance -= toAmount;

                alert(
                    `Чтобы заменить ${oldAssetName} на ${toCoinName}, ` +
                    `обмени весь доступный остаток ${oldAssetName}: ${money(p.assetAvailable)}.`
                );
                return;
            }

            p.assetName = toCoinName;
            p.assetAvailable = toAmount;
        }
    }

    addOperation({
        type: "exchange",
        projectId: p.id,
        fromType,
        fromCoin: fromName,
        toCoin: toCoinName,
        fromAmount,
        toAmount,
        toWasBase: !!baseCoin && toCoinName === baseCoin.name.toUpperCase(),
        label: `Обмен ${money(fromAmount)} ${fromName} → ${money(toAmount)} ${toCoinName}`
    });

    addHistory(
        "exchange",
        `${p.name}: обмен ${money(fromAmount)} ${fromName} → ${money(toAmount)} ${toCoinName}`
    );

    save();
    closeModal();
    render();
}

/* =========================

   Новые ручные инвестиции и обмены можно отменять.
========================= */

function addOperation(op) {
    if (!Array.isArray(data.operations)) data.operations = [];
    data.operations.unshift({
        id: Date.now().toString() + Math.random().toString(16).slice(2),
        date: dateNow(),
        cancelled: false,
        ...op
    });
}

function renderProjectOperations(projectId) {

    if (!Array.isArray(data.operations)) return "";

    const ops = data.operations
        .filter(o => o.projectId === projectId)
        .slice(0, 8);

    if (!ops.length) return "";

    return `
        <div style="margin-top:14px">
            <div class="small"><b>Последние операции проекта</b></div>
            ${ops.map(o => `
                <div class="status ${o.cancelled ? "" : "success"}" style="margin-top:7px">
                    <div>
                        ${escapeHtml(o.label || o.type)}
                        ${o.cancelled ? " — ОТМЕНЕНО" : ""}
                    </div>
                    <div class="small">${escapeHtml(o.date || "")}</div>
                    ${
                        !o.cancelled && (o.type === "manual-invest" || o.type === "exchange")
                        ? `<button class="danger" onclick="cancelProjectOperation('${o.id}')">↩️ Отменить</button>`
                        : ""
                    }
                </div>
            `).join("")}
        </div>
    `;
}

function cancelProjectOperation(operationId) {

    const op = data.operations.find(o => o.id === operationId);

    if (!op || op.cancelled) {
        alert("Операция уже отменена или не найдена.");
        return;
    }

    const p = getProject(op.projectId);

    if (!p) {
        alert("Проект не найден.");
        return;
    }

    if (!confirm(
        `Отменить операцию?\n\n${op.label || op.type}\n\n` +
        `Связанные балансы будут возвращены в состояние до этой операции.`
    )) return;

    if (op.type === "manual-invest") {

        const coin = getCoin(op.coinId);

        if (op.isBase) {
            if (Number(p.invested || 0) + 0.00000001 < op.amount) {
                alert("Нельзя отменить: инвестированная сумма проекта уже меньше суммы этой операции.");
                return;
            }
            p.invested -= op.amount;
        } else {
            if (
                p.assetName.toUpperCase() !== op.coinName.toUpperCase() ||
                Number(p.assetInvested || 0) + 0.00000001 < op.amount
            ) {
                alert("Нельзя отменить: актив или инвестированная сумма проекта уже изменились.");
                return;
            }
            p.assetInvested -= op.amount;
        }

        if (op.reduceFund && coin) {
            coin.balance += op.amount;
        }

    } else if (op.type === "exchange") {

        const fromCoin = data.coins.find(
            c => c.name.toLowerCase() === op.fromCoin.toLowerCase()
        );
        const toCoin = data.coins.find(
            c => c.name.toLowerCase() === op.toCoin.toLowerCase()
        );
        const baseCoin = getCoin(p.coinId);

        if (op.fromType === "base") {

            if (
                p.assetName.toUpperCase() !== op.toCoin.toUpperCase() ||
                Number(p.assetAvailable || 0) + 0.00000001 < op.toAmount
            ) {
                alert("Нельзя отменить этот обмен: полученные монеты уже были использованы или актив проекта изменился.");
                return;
            }

            p.available += op.fromAmount;
            p.assetAvailable -= op.toAmount;

            if (fromCoin) fromCoin.balance += op.fromAmount;
            if (toCoin) toCoin.balance -= op.toAmount;

            if (
                Number(p.assetAvailable) <= 0.00000001 &&
                Number(p.assetInvested || 0) <= 0.00000001
            ) {
                p.assetAvailable = 0;
                p.assetName = "";
            }

        } else if (op.toWasBase) {

            if (Number(p.available || 0) + 0.00000001 < op.toAmount) {
                alert("Нельзя отменить: полученные базовые монеты проекта уже использованы.");
                return;
            }

            p.available -= op.toAmount;
            p.assetName = op.fromCoin;
            p.assetAvailable = Number(p.assetAvailable || 0) + op.fromAmount;

            if (fromCoin) fromCoin.balance += op.fromAmount;
            if (toCoin) toCoin.balance -= op.toAmount;

        } else {
            alert("Отмена обмена одной проектной монеты на другую пока недоступна после последующих изменений.");
            return;
        }
    }

    op.cancelled = true;

    addHistory(
        "cancel",
        `Отменена операция: ${op.label || op.type}`
    );

    save();
    render();
}

function saveManualProjectInvestment(id) {

    const p = getProject(id);
    const coinId = document.getElementById("manualInvestmentCoin").value;
    const coin = getCoin(coinId);
    const amount = Number(document.getElementById("manualInvestmentAmount").value);
    const reduceFund = document.getElementById("manualInvestmentReduceFund").checked;

    if (!coin) {
        alert("Монета не найдена.");
        return;
    }

    if (!amount || amount <= 0) {
        alert("Введите сумму инвестиции.");
        return;
    }

    if (reduceFund && amount > Number(coin.balance) + 0.00000001) {
        alert(`В балансе фонда недостаточно ${coin.name}.`);
        return;
    }

    const coinName = coin.name.toUpperCase();

    // Если инвестиция в базовой монете проекта — используем старое поле invested.
    if (coin.id === p.coinId) {
        p.invested = Number(p.invested || 0) + amount;
    } else {
        // Для внешнего актива проекта (USDT, CLX и т.д.)
        if (
            p.assetName &&
            p.assetName.toUpperCase() !== coinName &&
            (Number(p.assetAvailable || 0) > 0.00000001 ||
             Number(p.assetInvested || 0) > 0.00000001)
        ) {
            alert(
                `В проекте уже используется актив ${p.assetName}. ` +
                `Нельзя смешать его с ${coinName} в одном балансе проекта.`
            );
            return;
        }

        p.assetName = coinName;
        p.assetInvested = Number(p.assetInvested || 0) + amount;
    }

    if (reduceFund) {
        coin.balance -= amount;
    }

    addOperation({
        type: "manual-invest",
        projectId: p.id,
        coinId: coin.id,
        coinName: coin.name,
        amount,
        reduceFund,
        isBase: coin.id === p.coinId,
        label: `Ручная инвестиция ${money(amount)} ${coin.name}`
    });

    addHistory(
        "invest",
        `Ручная инвестиция: ${money(amount)} ${coin.name} → ${p.name}` +
        (reduceFund
            ? `. Баланс фонда уменьшен на ${money(amount)} ${coin.name}.`
            : `. Баланс фонда не изменён.`)
    );

    save();
    closeModal();
    render();
}

function addProfit(id) {

    const p = getProject(id);
    const coin = getCoin(p.coinId);

    const profit = Number(
        document.getElementById("profitAmount").value
    );

    if (!profit || profit <= 0) {
        alert("Введите прибыль.");
        return;
    }

    const reinvest = profit * 0.5;
    const withdrawPart = profit * 0.5;

    /*
       Если проект работает в собственной монете (например BYA),
       реинвест остаётся именно в BYA.
       Часть для вывода также хранится в BYA до ручного обратного обмена.
    */
    if (p.assetName) {

        p.assetInvested = Number(p.assetInvested || 0) + reinvest;

        if (!Array.isArray(p.pendingExit)) p.pendingExit = [];

        p.pendingExit.push({
            id: Date.now().toString(),
            assetName: p.assetName,
            amount: withdrawPart,
            date: dateNow()
        });

        addHistory(
            "profit",
            `Прибыль ${money(profit)} ${p.assetName} от ${p.name}. ` +
            `Реинвест: ${money(reinvest)} ${p.assetName}, ` +
            `к обмену для вывода: ${money(withdrawPart)} ${p.assetName}`
        );

    } else {

        // Старая логика для проекта, который работает прямо в монете фонда.
        const projects = data.projects.filter(
            x => x.coinId === p.coinId
        );

        projects.forEach(project => {
            project.available += reinvest * (project.percent / 100);
        });

        let existing = data.withdrawals.find(
            w => w.coinId === p.coinId
        );

        if (!existing) {
            existing = {
                id: Date.now().toString(),
                coinId: p.coinId,
                amount: 0,
                sent: 0
            };
            data.withdrawals.push(existing);
        }

        existing.amount += withdrawPart;
        coin.balance += profit;

        addHistory(
            "profit",
            `Прибыль ${money(profit)} ${coin.name} от ${p.name}. ` +
            `Реинвест: ${money(reinvest)}, вывод: ${money(withdrawPart)}`
        );
    }

    save();
    closeModal();
    render();
}

function getPendingExitAmount(p) {
    if (!Array.isArray(p.pendingExit)) return 0;
    return p.pendingExit.reduce((sum, x) => sum + Number(x.amount || 0), 0);
}

function exchangeProfitForWithdrawal(id) {

    const p = getProject(id);
    const coin = getCoin(p.coinId);

    const fromAmount = Number(document.getElementById("exitFromAmount").value);
    const toCoinName = document.getElementById("exitToCoin").value.trim().toUpperCase();
    const toAmount = Number(document.getElementById("exitToAmount").value);
    const pending = getPendingExitAmount(p);

    if (!fromAmount || fromAmount <= 0 || !toCoinName || !toAmount || toAmount <= 0) {
        alert("Укажи: сколько отдал, КАКУЮ монету получил и сколько этой монеты получил.");
        return;
    }

    if (fromAmount > pending + 0.00000001) {
        alert(`Нельзя обменять больше ${money(pending)} ${p.assetName}.`);
        return;
    }

    let left = fromAmount;

    for (const item of p.pendingExit) {
        if (left <= 0) break;
        const take = Math.min(Number(item.amount || 0), left);
        item.amount -= take;
        left -= take;
    }

    p.pendingExit = p.pendingExit.filter(x => Number(x.amount) > 0.00000001);

    // Находим или создаём монету, которую фактически получили.
    let toCoin = data.coins.find(
        c => c.name.toLowerCase() === toCoinName.toLowerCase()
    );

    if (!toCoin) {
        toCoin = {
            id: (Date.now() + 1).toString(),
            name: toCoinName,
            balance: 0
        };
        data.coins.push(toCoin);
        addHistory("coin", `Добавлена монета ${toCoinName} через обмен прибыли`);
    }

    let existing = data.withdrawals.find(
        w => w.coinId === toCoin.id
    );

    if (!existing) {
        existing = {
            id: (Date.now() + 2).toString(),
            coinId: toCoin.id,
            amount: 0,
            sent: 0
        };
        data.withdrawals.push(existing);
    }

    existing.amount += toAmount;
    toCoin.balance += toAmount;

    addHistory(
        "exchange",
        `${p.name}: для вывода обменено ${money(fromAmount)} ${p.assetName} → ${money(toAmount)} ${toCoinName}`
    );

    save();
    closeModal();
    render();
}


/* =========================
   ВЫВОД
========================= */

function renderWithdrawals() {

    const box = document.getElementById("withdrawals");

    const active = data.withdrawals.filter(
        w => w.amount - w.sent > 0.00000001
    );

    if (!active.length) {
        box.innerHTML = `
            <div class="empty">
                Пока ничего не нужно вывести.
            </div>
        `;
        return;
    }

    box.innerHTML = active.map(w => {

        const coin = getCoin(w.coinId);

        const remaining = w.amount - w.sent;

        return `
        <div class="coin-card">

            <div class="row">
                <div>
                    <b>💸 ${coin ? escapeHtml(coin.name) : "Монета удалена"}</b>
                    <div class="small">Осталось отправить</div>
                </div>

                <div class="amount">
                    ${money(remaining)}
                </div>
            </div>

            <button onclick="openWithdrawal('${w.id}')">
                📤 Указать отправленную сумму
            </button>

        </div>
        `;

    }).join("");
}

function openWithdrawal(id) {

    const w = data.withdrawals.find(x => x.id === id);
    const coin = getCoin(w.coinId);

    const remaining = w.amount - w.sent;

    document.getElementById("modalContent").innerHTML = `

        <h2>💸 Вывод ${escapeHtml(coin.name)}</h2>

        <p>
            Нужно отправить:
            <b>${money(remaining)} ${escapeHtml(coin.name)}</b>
        </p>

        <label>Фактически отправлено</label>

        <input id="sentAmount"
            type="number"
            step="any"
            max="${remaining}"
            placeholder="Например: 50">

        <button class="green" onclick="registerWithdrawal('${id}')">
            Подтвердить
        </button>
    `;

    openModal();
}

function registerWithdrawal(id) {

    const w = data.withdrawals.find(x => x.id === id);
    const coin = getCoin(w.coinId);

    const remaining = w.amount - w.sent;

    const amount = Number(
        document.getElementById("sentAmount").value
    );

    if (!amount || amount <= 0) {
        alert("Введите сумму.");
        return;
    }

    if (amount > remaining) {
        alert("Нельзя отправить больше оставшейся суммы.");
        return;
    }

    w.sent += amount;

    coin.balance -= amount;

    addHistory(
        "withdraw",
        `Вывод: ${money(amount)} ${coin.name}`
    );

    save();
    closeModal();
    render();
}

/* =========================
   ИСТОРИЯ
========================= */

function renderHistory() {

    const box = document.getElementById("historyList");

    if (!data.history.length) {
        box.innerHTML = `
            <div class="empty">
                История пока пустая.
            </div>
        `;
        return;
    }

    box.innerHTML = data.history.map(h => {

        return `
        <div class="history-item">
            <div>${escapeHtml(h.text)}</div>
            <div class="small">${escapeHtml(h.date)}</div>
        </div>
        `;

    }).join("");
}

/* =========================
   УДАЛЕНИЕ ПРОЕКТА
========================= */

function deleteProject(id) {

    const p = getProject(id);

    if (!confirm(
        `Удалить проект "${p.name}"?\n\n` +
        `Это нельзя будет отменить.`
    )) {
        return;
    }

    /*
       Если на проект ссылаются поступления,
       удаление проекта оставит эти старые распределения
       без проекта. Поэтому сначала предупреждаем.
    */
    const linkedDeposits = data.deposits.filter(d =>
        Array.isArray(d.allocations) &&
        d.allocations.some(a => a.projectId === id)
    );

    if (linkedDeposits.length) {

        alert(
            "Нельзя удалить проект, потому что с ним связаны " +
            "существующие поступления.\n\n" +
            "Сначала измени/удали связанные поступления."
        );

        return;
    }

    data.projects = data.projects.filter(x => x.id !== id);

    addHistory(
        "project",
        `Удалён проект: ${p.name}`
    );

    save();
    render();
}

/* =========================
   MODAL
========================= */

function openModal() {
    document.getElementById("modal").classList.remove("hidden");
}

function closeModal() {
    document.getElementById("modal").classList.add("hidden");
}

/* =========================
   БЕЗОПАСНЫЙ HTML
========================= */

function escapeHtml(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function escapeAttr(text) {
    return escapeHtml(text);
}

/* =========================
   ОБНОВЛЕНИЕ ЭКРАНА
========================= */

function render() {
    renderFund();
    renderDeposits();
    renderProjects();
    renderWithdrawals();
    renderHistory();
}

render();
showPage('fund');

</script>
