<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Private Fund</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #17202a;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 16px;
}

h1 { margin: 5px 0 18px; font-size: 25px; }
h2 { font-size: 20px; margin-top: 0; }

.card {
    background: white;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.coin-card, .project-card {
    border: 1px solid #e3e7eb;
    border-radius: 12px;
    padding: 13px;
    margin-top: 10px;
}

.row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.amount { font-size: 22px; font-weight: bold; }
.small { font-size: 13px; color: #6b7280; }

.actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
}
.actions button { margin-top: 0; }

.fund-details {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid #eee;
    font-size: 14px;
    line-height: 1.7;
    color: #5b6470;
}

button {
    border: 0;
    border-radius: 11px;
    padding: 11px 15px;
    font-size: 15px;
    cursor: pointer;
    background: #2481cc;
    color: white;
    margin-top: 8px;
}

button.secondary { background: #e9eef3; color: #17202a; }
button.danger { background: #e55353; }
button.green { background: #27a66f; }

input, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccd3da;
    border-radius: 10px;
    margin-top: 6px;
    margin-bottom: 10px;
    font-size: 16px;
    background: white;
}

label { font-size: 13px; color: #5b6470; }

nav {
    display: flex;
    gap: 5px;
    background: white;
    padding: 6px;
    border-radius: 14px;
    margin-bottom: 15px;
    position: sticky;
    top: 5px;
    z-index: 10;
}

nav button {
    flex: 1;
    margin: 0;
    background: transparent;
    color: #555;
    padding: 10px 5px;
}

nav button.active { background: #2481cc; color: white; }

.hidden { display: none !important; }

.total { font-size: 14px; margin-top: 5px; }

.status {
    padding: 7px 10px;
    border-radius: 8px;
    background: #eef5ff;
    color: #2471b8;
    display: inline-block;
    font-size: 13px;
    margin-top: 8px;
}

.warning { background: #fff4d6; color: #8a6200; }
.success { background: #e5f8ef; color: #168553; }
.error { background: #ffe8e8; color: #bd3030; }

hr {
    border: 0;
    border-top: 1px solid #eee;
    margin: 15px 0;
}

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
}

.modal-box {
    background: white;
    width: 100%;
    max-width: 700px;
    padding: 20px;
    border-radius: 20px 20px 0 0;
    max-height: 90vh;
    overflow-y: auto;
}

.close { float: right; background: #eee; color: #333; margin: 0; }

.empty { text-align: center; color: #777; padding: 25px 10px; }

.history-item {
    padding: 10px 0;
    border-bottom: 1px solid #eee;
}

.plus { color: #15945c; }
.minus { color: #c93636; }

.deposit-item {
    border: 1px solid #e3e7eb;
    border-radius: 12px;
    padding: 13px;
    margin-top: 10px;
}

.deposit-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.deposit-actions button {
    margin-top: 8px;
}

.danger-text {
    color: #bd3030;
    font-size: 13px;
    margin-top: 8px;
}
</style>
</head>

<body>

<div class="container">

<h1>🏦 Private Fund</h1>

<nav>
    <button id="navFund" class="active" onclick="showPage('fund')">🏦 Фонд</button>
    <button id="navProjects" onclick="showPage('projects')">📊 Проекты</button>
    <button id="navHistory" onclick="showPage('history')">📜 История</button>
</nav>

<!-- ФОНД -->
<div id="pageFund">

    <div class="card">
        <div class="row">
            <div>
                <h2>💰 Фонд</h2>
                <div class="small">Текущие средства</div>
            </div>
            <div class="actions">
                <button onclick="openDeposit()">＋ Поступление</button>
                <button class="secondary" onclick="openExchange()">🔄 Обмен</button>
            </div>
        </div>

        <div id="fundCoins"></div>
    </div>

    <!-- НОВОЕ: СПИСОК ПОСТУПЛЕНИЙ -->
    <div class="card">
        <h2>📥 Поступления</h2>
        <div class="small">Здесь можно изменить или удалить отдельное поступление.</div>
        <div id="depositsList"></div>
    </div>

    <div class="card">
        <h2>💸 К выводу</h2>
        <div id="withdrawals"></div>
    </div>

</div>

<!-- ПРОЕКТЫ -->
<div id="pageProjects" class="hidden">

    <div class="card">
        <div class="row">
            <div>
                <h2>📊 Проекты</h2>
                <div class="small">Распределение фонда</div>
            </div>
            <button onclick="openProject()">＋ Проект</button>
        </div>

        <div id="percentTotal"></div>
    </div>

    <div id="projectsList"></div>

</div>

<!-- ИСТОРИЯ -->
<div id="pageHistory" class="hidden">

    <div class="card">
        <h2>📜 История</h2>
        <div id="historyList"></div>
    </div>

</div>

<!-- MODAL -->
<div id="modal" class="modal hidden">
    <div class="modal-box">
        <button class="close" onclick="closeModal()">✕</button>
        <div id="modalContent"></div>
    </div>
</div>

<script>

/* =========================
   ДАННЫЕ
========================= */

let data = JSON.parse(localStorage.getItem("privateFundData")) || {
    coins: [],
    projects: [],
    withdrawals: [],
    deposits: [],
    exchanges: [],
    history: []
};

/* Совместимость со старой версией */
if (!Array.isArray(data.coins)) data.coins = [];
if (!Array.isArray(data.projects)) data.projects = [];
if (!Array.isArray(data.withdrawals)) data.withdrawals = [];
if (!Array.isArray(data.deposits)) data.deposits = [];
if (!Array.isArray(data.exchanges)) data.exchanges = [];
if (!Array.isArray(data.history)) data.history = [];

function save() {
    localStorage.setItem("privateFundData", JSON.stringify(data));
}

/* =========================
   ОДНОРАЗОВОЕ УДАЛЕНИЕ СТАРЫХ 1000 AXM
   Удаляет старый баланс 1000 AXM, который был
   добавлен до появления журнала поступлений.
========================= */
if (!localStorage.getItem("old1000Removed")) {
    const axm = data.coins.find(c => c.name.toLowerCase() === "axm");
    if (axm && Number(axm.balance) === 1000) {
        axm.balance = 0;

        // Убираем также старые доступные средства проектов AXM.
        data.projects.forEach(p => {
            if (p.coinId === axm.id) {
                p.available = 0;
            }
        });

        localStorage.setItem("old1000Removed", "1");
        save();
    }
}

/* =========================
   TELEGRAM
========================= */

if (window.Telegram && Telegram.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
}

/* =========================
   НАВИГАЦИЯ
========================= */

function showPage(page) {

    document.getElementById("pageFund").classList.add("hidden");
    document.getElementById("pageProjects").classList.add("hidden");
    document.getElementById("pageHistory").classList.add("hidden");

    document.getElementById("navFund").classList.remove("active");
    document.getElementById("navProjects").classList.remove("active");
    document.getElementById("navHistory").classList.remove("active");

    if (page === "fund") {
        document.getElementById("pageFund").classList.remove("hidden");
        document.getElementById("navFund").classList.add("active");
    }

    if (page === "projects") {
        document.getElementById("pageProjects").classList.remove("hidden");
        document.getElementById("navProjects").classList.add("active");
    }

    if (page === "history") {
        document.getElementById("pageHistory").classList.remove("hidden");
        document.getElementById("navHistory").classList.add("active");
    }

    render();
}

/* =========================
   ВСПОМОГАТЕЛЬНОЕ
========================= */

function money(n) {
    return Number(n || 0).toLocaleString("ru-RU", {
        maximumFractionDigits: 8
    });
}

function dateNow() {
    return new Date().toLocaleString("ru-RU");
}

function getCoin(id) {
    return data.coins.find(c => c.id === id);
}

function getProject(id) {
    return data.projects.find(p => p.id === id);
}

function getProjectReserved(coinId) {
    return data.projects
        .filter(p => p.coinId === coinId)
        .reduce((sum, p) => sum + Math.max(0, Number(p.available || 0)), 0);
}

function getWithdrawalReserved(coinId) {
    return data.withdrawals
        .filter(w => w.coinId === coinId)
        .reduce((sum, w) => sum + Math.max(0, Number(w.amount || 0) - Number(w.sent || 0)), 0);
}

function getFreeBalance(coinId) {
    const coin = getCoin(coinId);
    if (!coin) return 0;
    return Math.max(
        0,
        Number(coin.balance || 0) -
        getProjectReserved(coinId) -
        getWithdrawalReserved(coinId)
    );
}

function getAxmCoin() {
    return data.coins.find(c => c.name.trim().toLowerCase() === "axm");
}

function addWithdrawal(coinId, amount) {
    let w = data.withdrawals.find(x => x.coinId === coinId);
    if (!w) {
        w = { id: Date.now().toString(), coinId, amount: 0, sent: 0 };
        data.withdrawals.push(w);
    }
    w.amount += Number(amount);
    return w;
}

function addHistory(type, text) {
    data.history.unshift({
        id: Date.now().toString(),
        type,
        text,
        date: dateNow()
    });
}

/*
   Распределение поступления между проектами.
   ВАЖНО: сохраняем распределение внутри самого поступления.
   Поэтому изменение процентов проектов в будущем не меняет
   старые поступления.
*/
function makeDepositAllocations(coinId, amount) {

    const projects = data.projects.filter(p => p.coinId === coinId);

    return projects.map(p => ({
        projectId: p.id,
        amount: amount * (Number(p.percent) / 100)
    }));
}

function applyDepositAllocation(allocations, multiplier) {

    allocations.forEach(a => {
        const project = getProject(a.projectId);

        if (project) {
            project.available += Number(a.amount) * multiplier;
        }
    });
}

/* =========================
   ФОНД
========================= */

function renderFund() {

    const box = document.getElementById("fundCoins");

    if (!data.coins.length) {
        box.innerHTML = `
            <div class="empty">
                Пока нет монет.<br>
                Добавь первую монету через «＋ Поступление».
            </div>
        `;
        return;
    }

    box.innerHTML = data.coins.map(c => {
        const total = Number(c.balance || 0);
        const projectReserved = getProjectReserved(c.id);
        const withdrawalReserved = getWithdrawalReserved(c.id);
        const free = getFreeBalance(c.id);

        return `
        <div class="coin-card">
            <div class="row">
                <div>
                    <b>🪙 ${escapeHtml(c.name)}</b>
                    <div class="small">Общий баланс фонда</div>
                </div>
                <div class="amount">${money(total)}</div>
            </div>

            <div class="fund-details">
                <div>🟢 Свободно: <b>${money(free)} ${escapeHtml(c.name)}</b></div>
                <div>📊 Проекты: ${money(projectReserved)} ${escapeHtml(c.name)}</div>
                <div>💸 К выводу: ${money(withdrawalReserved)} ${escapeHtml(c.name)}</div>
            </div>
        </div>`;
    }).join("");
}

/* =========================
   ПОСТУПЛЕНИЕ
========================= */

function openDeposit() {

    let coinOptions = data.coins.map(c =>
        `<option value="${c.id}">${escapeHtml(c.name)}</option>`
    ).join("");

    document.getElementById("modalContent").innerHTML = `

        <h2>📥 Поступление</h2>

        ${
            data.coins.length
            ?
            `
            <label>Монета</label>
            <select id="depositCoin">
                ${coinOptions}
            </select>

            <label>Количество</label>
            <input id="depositAmount"
                type="number"
                step="any"
                min="0"
                placeholder="Например: 1000">

            <button onclick="deposit()">Добавить поступление</button>
            `
            :
            `
            <div class="status warning">
                Сначала нужно создать монету.
            </div>
            `
        }

        <hr>

        <button class="secondary" onclick="openCoin()">
            ＋ Добавить новую монету
        </button>
    `;

    openModal();
}

function deposit() {

    const coinId = document.getElementById("depositCoin").value;
    const amount = Number(document.getElementById("depositAmount").value);

    if (!coinId || !amount || amount <= 0) {
        alert("Введите корректную сумму.");
        return;
    }

    const coin = getCoin(coinId);

    if (!coin) {
        alert("Монета не найдена.");
        return;
    }

    const allocations = makeDepositAllocations(coinId, amount);

    coin.balance += amount;

    applyDepositAllocation(allocations, 1);

    const depositRecord = {
        id: Date.now().toString(),
        coinId: coinId,
        amount: amount,
        date: dateNow(),
        allocations: allocations
    };

    data.deposits.push(depositRecord);

    addHistory(
        "deposit",
        `Поступление +${money(amount)} ${coin.name}`
    );

    save();
    closeModal();
    render();
}

/* =========================
   ИЗМЕНЕНИЕ ПОСТУПЛЕНИЯ
========================= */

function openEditDeposit(id) {

    const d = data.deposits.find(x => x.id === id);

    if (!d) {
        alert("Поступление не найдено.");
        return;
    }

    const coin = getCoin(d.coinId);

    if (!coin) {
        alert("Монета этого поступления не найдена.");
        return;
    }

    document.getElementById("modalContent").innerHTML = `

        <h2>✏️ Изменить поступление</h2>

        <p>
            Монета: <b>${escapeHtml(coin.name)}</b><br>
            Текущая сумма: <b>${money(d.amount)} ${escapeHtml(coin.name)}</b>
        </p>

        <label>Новая сумма</label>

        <input id="editDepositAmount"
            type="number"
            step="any"
            min="0"
            value="${d.amount}">

        <div class="small">
            Проекты получат изменение пропорционально распределению,
            которое было сохранено у этого поступления.
        </div>

        <button class="green" onclick="editDeposit('${id}')">
            💾 Сохранить изменения
        </button>

        <button class="danger" onclick="deleteDeposit('${id}')">
            🗑 Удалить поступление
        </button>
    `;

    openModal();
}

function editDeposit(id) {

    const d = data.deposits.find(x => x.id === id);

    if (!d) {
        alert("Поступление не найдено.");
        return;
    }

    const coin = getCoin(d.coinId);

    const newAmount = Number(
        document.getElementById("editDepositAmount").value
    );

    if (!newAmount || newAmount <= 0) {
        alert("Введите корректную сумму.");
        return;
    }

    const oldAmount = Number(d.amount);
    const difference = newAmount - oldAmount;

    /*
       Не позволяем изменить поступление так,
       чтобы баланс фонда стал отрицательным.
    */
    if (coin.balance + difference < -0.00000001) {
        alert(
            "Нельзя уменьшить поступление настолько: " +
            "в фонде недостаточно средств."
        );
        return;
    }

    /*
       Изменяем баланс фонда.
    */
    coin.balance += difference;

    /*
       Изменяем доступные средства проектов.
       Используем сохранённые доли именно этого поступления.
    */
    if (oldAmount > 0 && Array.isArray(d.allocations)) {

        d.allocations.forEach(a => {

            const project = getProject(a.projectId);

            if (!project) return;

            const share = Number(a.amount) / oldAmount;

            project.available += difference * share;

            if (project.available < -0.00000001) {
                project.available = 0;
            }

            a.amount = newAmount * share;
        });

    } else {

        /*
           Запасной вариант для старых записей.
        */
        const newAllocations = makeDepositAllocations(
            d.coinId,
            newAmount
        );

        applyDepositAllocation(
            newAllocations,
            1
        );

        d.allocations = newAllocations;
    }

    d.amount = newAmount;

    addHistory(
        "deposit",
        `Изменено поступление: ${money(oldAmount)} → ${money(newAmount)} ${coin.name}`
    );

    save();
    closeModal();
    render();
}

/* =========================
   УДАЛЕНИЕ ПОСТУПЛЕНИЯ
========================= */

function deleteDeposit(id) {

    const d = data.deposits.find(x => x.id === id);

    if (!d) {
        alert("Поступление не найдено.");
        return;
    }

    const coin = getCoin(d.coinId);

    if (!coin) {
        alert("Монета этого поступления не найдена.");
        return;
    }

    const amount = Number(d.amount);

    if (!confirm(
        `Удалить поступление ${money(amount)} ${coin.name}?\n\n` +
        `Баланс фонда и доступные средства проектов будут уменьшены.`
    )) {
        return;
    }

    /*
       Если часть средств уже была инвестирована,
       после удаления может возникнуть отрицательное доступное
       значение проекта. Поэтому проверяем это заранее.
    */
    if (Array.isArray(d.allocations)) {

        for (const a of d.allocations) {

            const project = getProject(a.projectId);

            if (
                project &&
                project.available - Number(a.amount) < -0.00000001
            ) {
                alert(
                    `Нельзя удалить это поступление.\n\n` +
                    `У проекта "${project.name}" часть этих средств ` +
                    `уже недоступна (вероятно, она была инвестирована).\n\n` +
                    `Сначала нужно отменить соответствующую инвестицию.`
                );
                return;
            }
        }

    } else {

        if (coin.balance - amount < -0.00000001) {
            alert("Нельзя удалить поступление: в фонде недостаточно средств.");
            return;
        }
    }

    coin.balance -= amount;

    if (Array.isArray(d.allocations)) {
        applyDepositAllocation(d.allocations, -1);
    }

    data.deposits = data.deposits.filter(x => x.id !== id);

    addHistory(
        "deposit",
        `Удалено поступление: -${money(amount)} ${coin.name}`
    );

    save();
    closeModal();
    render();
}

/* =========================
   МОНЕТЫ
========================= */

function openCoin() {

    document.getElementById("modalContent").innerHTML = `

        <h2>🪙 Новая монета</h2>

        <label>Название монеты</label>
        <input id="coinName" placeholder="Например: AXM">

        <button onclick="addCoin()">Создать монету</button>
    `;
}

function addCoin() {

    const name = document.getElementById("coinName").value.trim();

    if (!name) {
        alert("Введите название.");
        return;
    }

    if (data.coins.some(c => c.name.toLowerCase() === name.toLowerCase())) {
        alert("Такая монета уже существует.");
        return;
    }

    data.coins.push({
        id: Date.now().toString(),
        name: name,
        balance: 0
    });

    addHistory("coin", `Добавлена монета ${name}`);

    save();

    openDeposit();
}

/* =========================
   ОБМЕН МОНЕТ
========================= */

function coinOptionsHtml(selectedId = "") {
    return data.coins.map(c => `
        <option value="${c.id}" ${c.id === selectedId ? "selected" : ""}>
            ${escapeHtml(c.name)}
        </option>
    `).join("");
}

function openExchange() {

    if (data.coins.length < 2) {
        document.getElementById("modalContent").innerHTML = `
            <h2>🔄 Обмен монет</h2>
            <div class="status warning">
                Для обмена нужны минимум две монеты.
            </div>
            <button onclick="openCoin()">＋ Добавить монету</button>
        `;
        openModal();
        return;
    }

    const from = data.coins[0];
    const to = data.coins[1];

    document.getElementById("modalContent").innerHTML = `
        <h2>🔄 Обмен монет</h2>

        <div class="status">
            Обмениваются только <b>свободные</b> средства.
            Деньги, уже распределённые проектам или зарезервированные к выводу,
            защищены от случайного обмена.
        </div>

        <label>Отдаём</label>
        <select id="exchangeFrom" onchange="updateExchangePreview()">
            ${coinOptionsHtml(from.id)}
        </select>

        <div id="exchangeAvailable" class="small"></div>

        <label>Получаем</label>
        <select id="exchangeTo" onchange="updateExchangePreview()">
            ${coinOptionsHtml(to.id)}
        </select>

        <label>Сколько отдаём?</label>
        <input id="exchangeAmount" type="number" step="any" min="0"
               placeholder="Например: 100"
               oninput="updateExchangePreview()">

        <label>Курс</label>
        <input id="exchangeRate" type="number" step="any" min="0"
               placeholder="Сколько FROM за 1 TO"
               oninput="updateExchangePreview()">

        <div class="small">
            Курс указывается так: <b>1 получаемая монета = X отдаваемых монет</b>.<br>
            Например: 1 USDT = 40 AXM.
        </div>

        <div id="exchangePreview" class="status">
            Введи сумму и курс.
        </div>

        <button class="green" onclick="exchangeCoins()">🔄 Выполнить обмен</button>
    `;

    openModal();
    updateExchangePreview();
}

function updateExchangePreview() {

    const from = getCoin(document.getElementById("exchangeFrom").value);
    const to = getCoin(document.getElementById("exchangeTo").value);
    const amount = Number(document.getElementById("exchangeAmount").value);
    const rate = Number(document.getElementById("exchangeRate").value);

    const available = document.getElementById("exchangeAvailable");
    const preview = document.getElementById("exchangePreview");

    if (from) {
        available.innerHTML =
            `Свободно: <b>${money(getFreeBalance(from.id))} ${escapeHtml(from.name)}</b>`;
    }

    if (!from || !to || from.id === to.id) {
        preview.className = "status error";
        preview.innerHTML = "Выбери две разные монеты.";
        return;
    }

    if (!amount || amount <= 0 || !rate || rate <= 0) {
        preview.className = "status";
        preview.innerHTML = "Введи сумму и курс.";
        return;
    }

    preview.className = "status success";
    preview.innerHTML =
        `Получишь: <b>${money(amount / rate)} ${escapeHtml(to.name)}</b>`;
}

function exchangeCoins() {

    const from = getCoin(document.getElementById("exchangeFrom").value);
    const to = getCoin(document.getElementById("exchangeTo").value);
    const amount = Number(document.getElementById("exchangeAmount").value);
    const rate = Number(document.getElementById("exchangeRate").value);

    if (!from || !to || from.id === to.id) {
        alert("Выбери две разные монеты.");
        return;
    }

    if (!amount || amount <= 0 || !rate || rate <= 0) {
        alert("Введите корректную сумму и курс.");
        return;
    }

    const free = getFreeBalance(from.id);

    if (amount > free + 0.00000001) {
        alert(
            `Недостаточно свободных средств.\\n\\n` +
            `Можно обменять максимум ${money(free)} ${from.name}.`
        );
        return;
    }

    const received = amount / rate;

    from.balance -= amount;
    to.balance += received;

    /*
       Полученная монета распределяется между проектами
       этой монеты согласно их процентам.
    */
    const allocations = makeDepositAllocations(to.id, received);
    applyDepositAllocation(allocations, 1);

    data.exchanges.push({
        id: Date.now().toString(),
        fromCoinId: from.id,
        fromAmount: amount,
        toCoinId: to.id,
        toAmount: received,
        rate,
        purpose: "fund",
        date: dateNow()
    });

    addHistory(
        "exchange",
        `Обмен: ${money(amount)} ${from.name} → ${money(received)} ${to.name}. ` +
        `Курс: 1 ${to.name} = ${money(rate)} ${from.name}`
    );

    save();
    closeModal();
    render();
}


/* =========================
   ОБМЕН СРЕДСТВ К ВЫВОДУ В AXM
========================= */

function openWithdrawalExchange(id) {

    const w = data.withdrawals.find(x => x.id === id);
    const axm = getAxmCoin();

    if (!w || !axm) {
        alert("Не найдено поступление к выводу или монета AXM.");
        return;
    }

    const from = getCoin(w.coinId);
    const remaining = Number(w.amount || 0) - Number(w.sent || 0);

    if (!from || from.id === axm.id || remaining <= 0) {
        alert("Эту запись нельзя обменять в AXM.");
        return;
    }

    document.getElementById("modalContent").innerHTML = `
        <h2>🔄 Обмен к выводу в AXM</h2>

        <p>
            Сейчас к выводу:
            <b>${money(remaining)} ${escapeHtml(from.name)}</b>
        </p>

        <label>Сколько обменять?</label>
        <input id="withdrawExchangeAmount"
               type="number" step="any" min="0"
               max="${remaining}" value="${remaining}"
               oninput="updateWithdrawalExchangePreview()">

        <label>Курс</label>
        <input id="withdrawExchangeRate"
               type="number" step="any" min="0"
               placeholder="Сколько ${escapeHtml(from.name)} за 1 AXM"
               oninput="updateWithdrawalExchangePreview()">

        <div class="small">
            Например: 1 AXM = 0,025 USDT → введи <b>0,025</b>.
        </div>

        <div id="withdrawExchangePreview" class="status">
            Введи курс.
        </div>

        <button class="green" onclick="exchangeWithdrawalToAxm('${id}')">
            🔄 Обменять в AXM
        </button>
    `;

    openModal();
}

function updateWithdrawalExchangePreview() {

    const amount = Number(document.getElementById("withdrawExchangeAmount").value);
    const rate = Number(document.getElementById("withdrawExchangeRate").value);
    const box = document.getElementById("withdrawExchangePreview");

    if (!amount || !rate || amount <= 0 || rate <= 0) {
        box.className = "status";
        box.innerHTML = "Введи курс.";
        return;
    }

    box.className = "status success";
    box.innerHTML = `Получишь: <b>${money(amount / rate)} AXM</b>`;
}

function exchangeWithdrawalToAxm(id) {

    const w = data.withdrawals.find(x => x.id === id);
    const axm = getAxmCoin();

    if (!w || !axm) {
        alert("Не удалось найти данные.");
        return;
    }

    const from = getCoin(w.coinId);
    const remaining = Number(w.amount || 0) - Number(w.sent || 0);
    const amount = Number(document.getElementById("withdrawExchangeAmount").value);
    const rate = Number(document.getElementById("withdrawExchangeRate").value);

    if (!from || from.id === axm.id) {
        alert("Неверная монета.");
        return;
    }

    if (!amount || amount <= 0 || !rate || rate <= 0) {
        alert("Введите корректную сумму и курс.");
        return;
    }

    if (amount > remaining + 0.00000001) {
        alert("Нельзя обменять больше суммы к выводу.");
        return;
    }

    const received = amount / rate;

    /*
       Переносим резерв к выводу из исходной монеты в AXM.
       Инвестиционные проекты при этом не затрагиваются.
    */
    w.amount -= amount;
    from.balance -= amount;
    axm.balance += received;
    addWithdrawal(axm.id, received);

    data.exchanges.push({
        id: Date.now().toString(),
        fromCoinId: from.id,
        fromAmount: amount,
        toCoinId: axm.id,
        toAmount: received,
        rate,
        purpose: "withdrawal",
        date: dateNow()
    });

    addHistory(
        "exchange",
        `Обмен к выводу: ${money(amount)} ${from.name} → ` +
        `${money(received)} AXM. Курс: 1 AXM = ${money(rate)} ${from.name}`
    );

    save();
    closeModal();
    render();
}

/* =========================
   ПРОЕКТЫ
========================= */

function renderProjects() {

    const list = document.getElementById("projectsList");

    if (!data.projects.length) {
        list.innerHTML = `
            <div class="card empty">
                Пока нет проектов.<br>
                Нажми «＋ Проект», чтобы создать первый.
            </div>
        `;

        document.getElementById("percentTotal").innerHTML = "";
        return;
    }

    /*
       Проценты показываем отдельно по каждой монете.
       Раньше здесь считались проценты всех монет вместе,
       что могло давать неправильный результат.
    */

    const coinsWithProjects = [...new Set(
        data.projects.map(p => p.coinId)
    )];

    let percentHtml = "";

    coinsWithProjects.forEach(coinId => {

        const coin = getCoin(coinId);
        const projects = data.projects.filter(p => p.coinId === coinId);

        const total = projects.reduce(
            (sum, p) => sum + Number(p.percent),
            0
        );

        let statusClass = "success";
        let statusText = "100% — распределение полностью задано";

        if (total > 100.000001) {
            statusClass = "error";
            statusText =
                `${money(total)}% — превышение на ${money(total - 100)}%`;
        } else if (total < 99.999999) {
            statusClass = "warning";
            statusText =
                `${money(total)}% — можно добавить ещё ${money(100 - total)}%`;
        }

        percentHtml += `
            <div class="status ${statusClass}">
                ${coin ? escapeHtml(coin.name) : "Монета"}:
                <b>${money(total)}%</b><br>
                ${statusText}
            </div>
        `;
    });

    document.getElementById("percentTotal").innerHTML = percentHtml;

    list.innerHTML = data.projects.map(p => {

        const coin = getCoin(p.coinId);

        return `
        <div class="card project-card">

            <div class="row">
                <div>
                    <h2>📁 ${escapeHtml(p.name)}</h2>
                    <div class="small">
                        ${coin ? escapeHtml(coin.name) : "Монета удалена"}
                    </div>
                </div>

                <b>${money(p.percent)}%</b>
            </div>

            <hr>

            <div class="row">
                <div>
                    <div class="small">Доступно для инвестирования</div>
                    <div class="amount">
                        ${money(p.available)} ${coin ? escapeHtml(coin.name) : ""}
                    </div>
                </div>
            </div>

            <div style="margin-top:12px">
                <div class="small">Всего инвестировано</div>
                <b>${money(p.invested)} ${coin ? escapeHtml(coin.name) : ""}</b>
            </div>

            <button class="green" onclick="openInvest('${p.id}')">
                📤 Инвестировать
            </button>

            <button onclick="openProfit('${p.id}')">
                📈 Добавить прибыль
            </button>

            <button class="secondary" onclick="openProject('${p.id}')">
                ✏️ Изменить
            </button>

            <button class="danger" onclick="deleteProject('${p.id}')">
                🗑 Удалить
            </button>

        </div>
        `;

    }).join("");
}

/* =========================
   СОЗДАНИЕ / ИЗМЕНЕНИЕ ПРОЕКТА
========================= */

function openProject(id = null) {

    const project = id ? getProject(id) : null;

    let coinOptions = data.coins.map(c => `
        <option value="${c.id}"
            ${project && project.coinId === c.id ? "selected" : ""}>
            ${escapeHtml(c.name)}
        </option>
    `).join("");

    document.getElementById("modalContent").innerHTML = `

        <h2>${project ? "✏️ Изменить проект" : "📊 Новый проект"}</h2>

        ${
            !data.coins.length
            ?
            `
            <div class="status warning">
                Сначала нужно создать монету.
            </div>

            <button onclick="openCoin()">＋ Создать монету</button>
            `
            :
            `
            <label>Название проекта</label>
            <input id="projectName"
                value="${project ? escapeAttr(project.name) : ""}"
                placeholder="Например: Axiome">

            <label>Монета</label>
            <select id="projectCoin">
                ${coinOptions}
            </select>

            <label>Процент распределения</label>
            <input id="projectPercent"
                type="number"
                step="0.01"
                value="${project ? project.percent : ""}"
                placeholder="Например: 20">

            <div class="small">
                Можно создавать проекты постепенно. Сумма процентов одной монеты не может превышать 100%.
            </div>

            <button onclick="saveProject('${id || ""}')">
                💾 Сохранить
            </button>
            `
        }
    `;
}

function saveProject(id) {

    const name = document.getElementById("projectName").value.trim();
    const coinId = document.getElementById("projectCoin").value;
    const percent = Number(document.getElementById("projectPercent").value);
    const oldProject = id ? getProject(id) : null;

    if (!name || !coinId || !Number.isFinite(percent) || percent <= 0 || percent > 100) {
        alert("Заполни все поля. Процент должен быть от 0,01 до 100.");
        return;
    }

    if (
        oldProject &&
        oldProject.coinId !== coinId &&
        (Number(oldProject.available || 0) > 0.00000001 ||
         Number(oldProject.invested || 0) > 0.00000001)
    ) {
        alert("Нельзя изменить монету проекта, пока в нём есть средства.");
        return;
    }

    let total = percent;
    data.projects.forEach(p => {
        if (p.coinId === coinId && p.id !== id) total += Number(p.percent || 0);
    });

    if (total > 100.000001) {
        alert(
            `Для монеты ${getCoin(coinId).name} нельзя распределить больше 100%.\n\n` +
            `Сейчас получится: ${money(total)}%`
        );
        return;
    }

    if (id) {
        const project = getProject(id);
        project.name = name;
        project.coinId = coinId;
        project.percent = percent;
    } else {
        data.projects.push({
            id: Date.now().toString(),
            name,
            coinId,
            percent,
            available: 0,
            invested: 0
        });
    }

    addHistory("project",
        `${id ? "Изменён" : "Создан"} проект: ${name} (${money(percent)}%)`);

    save();
    closeModal();
    render();
}

/* =========================
   ИНВЕСТИЦИЯ
========================= */

function openInvest(id) {

    const p = getProject(id);
    const coin = getCoin(p.coinId);

    document.getElementById("modalContent").innerHTML = `

        <h2>📤 Инвестировать</h2>

        <p>
            <b>${escapeHtml(p.name)}</b><br>
            Доступно: <b>${money(p.available)} ${escapeHtml(coin.name)}</b>
        </p>

        <label>Сколько инвестировать?</label>
        <input id="investAmount"
            type="number"
            step="any"
            max="${p.available}"
            placeholder="Введите сумму">

        <button class="green" onclick="invest('${id}')">
            Подтвердить инвестицию
        </button>
    `;

    openModal();
}

function invest(id) {

    const p = getProject(id);
    const coin = getCoin(p.coinId);

    const amount = Number(document.getElementById("investAmount").value);

    if (!amount || amount <= 0) {
        alert("Введите сумму.");
        return;
    }

    if (amount > p.available) {
        alert("Недостаточно доступных средств.");
        return;
    }

    p.available -= amount;
    p.invested += amount;

    coin.balance -= amount;

    addHistory(
        "invest",
        `Инвестиция: ${money(amount)} ${coin.name} → ${p.name}`
    );

    save();
    closeModal();
    render();
}

/* =========================
   ПРИБЫЛЬ
========================= */

function openProfit(id) {

    const p = getProject(id);
    const coin = getCoin(p.coinId);

    document.getElementById("modalContent").innerHTML = `

        <h2>📈 Прибыль проекта</h2>

        <p>
            <b>${escapeHtml(p.name)}</b>
        </p>

        <label>Полученная прибыль</label>
        <input id="profitAmount"
            type="number"
            step="any"
            placeholder="Например: 100">

        <div class="small">
            По текущему правилу 50% пойдёт на реинвестирование,
            50% — на вывод.
        </div>

        <button onclick="addProfit('${id}')">
            Добавить прибыль
        </button>
    `;

    openModal();
}

function addProfit(id) {

    const p = getProject(id);
    const coin = getCoin(p ? p.coinId : null);
    const profit = Number(document.getElementById("profitAmount").value);

    if (!p || !coin) {
        alert("Проект или монета не найдены.");
        return;
    }

    if (!profit || profit <= 0) {
        alert("Введите прибыль.");
        return;
    }

    const reinvest = profit * 0.5;
    const withdraw = profit * 0.5;

    coin.balance += profit;

    const projects = data.projects.filter(x => x.coinId === p.coinId);
    const totalPercent = projects.reduce((sum, x) => sum + Number(x.percent || 0), 0);

    if (projects.length && totalPercent > 0) {
        projects.forEach(project => {
            project.available += reinvest * (Number(project.percent) / totalPercent);
        });
    }

    addWithdrawal(coin.id, withdraw);

    addHistory(
        "profit",
        `Прибыль ${money(profit)} ${coin.name} от ${p.name}. ` +
        `Реинвест: ${money(reinvest)}, вывод: ${money(withdraw)}`
    );

    save();
    closeModal();
    render();
}

/* =========================
   ВЫВОД
========================= */

function renderWithdrawals() {

    const box = document.getElementById("withdrawals");

    const active = data.withdrawals.filter(
        w => w.amount - w.sent > 0.00000001
    );

    if (!active.length) {
        box.innerHTML = `
            <div class="empty">
                Пока ничего не нужно вывести.
            </div>
        `;
        return;
    }

    box.innerHTML = active.map(w => {

        const coin = getCoin(w.coinId);

        const remaining = w.amount - w.sent;

        return `
        <div class="coin-card">

            <div class="row">
                <div>
                    <b>💸 ${coin ? escapeHtml(coin.name) : "Монета удалена"}</b>
                    <div class="small">Осталось отправить</div>
                </div>

                <div class="amount">
                    ${money(remaining)}
                </div>
            </div>

            ${
                coin && coin.name.trim().toLowerCase() !== "axm"
                ? `<button class="secondary" onclick="openWithdrawalExchange('${w.id}')">
                       🔄 Обменять в AXM
                   </button>`
                : ""
            }

            <button onclick="openWithdrawal('${w.id}')">
                📤 Указать отправленную сумму
            </button>

        </div>
        `;

    }).join("");
}

function openWithdrawal(id) {

    const w = data.withdrawals.find(x => x.id === id);
    const coin = getCoin(w.coinId);

    const remaining = w.amount - w.sent;

    document.getElementById("modalContent").innerHTML = `

        <h2>💸 Вывод ${escapeHtml(coin.name)}</h2>

        <p>
            Нужно отправить:
            <b>${money(remaining)} ${escapeHtml(coin.name)}</b>
        </p>

        <label>Фактически отправлено</label>

        <input id="sentAmount"
            type="number"
            step="any"
            max="${remaining}"
            placeholder="Например: 50">

        <button class="green" onclick="registerWithdrawal('${id}')">
            Подтвердить
        </button>
    `;

    openModal();
}

function registerWithdrawal(id) {

    const w = data.withdrawals.find(x => x.id === id);
    const coin = getCoin(w.coinId);

    const remaining = w.amount - w.sent;

    const amount = Number(
        document.getElementById("sentAmount").value
    );

    if (!amount || amount <= 0) {
        alert("Введите сумму.");
        return;
    }

    if (amount > remaining) {
        alert("Нельзя отправить больше оставшейся суммы.");
        return;
    }

    w.sent += amount;

    coin.balance -= amount;

    addHistory(
        "withdraw",
        `Вывод: ${money(amount)} ${coin.name}`
    );

    save();
    closeModal();
    render();
}

/* =========================
   ИСТОРИЯ
========================= */

function renderHistory() {

    const box = document.getElementById("historyList");

    if (!data.history.length) {
        box.innerHTML = `
            <div class="empty">
                История пока пустая.
            </div>
        `;
        return;
    }

    box.innerHTML = data.history.map(h => {

        return `
        <div class="history-item">
            <div>${escapeHtml(h.text)}</div>
            <div class="small">${escapeHtml(h.date)}</div>
        </div>
        `;

    }).join("");
}

/* =========================
   УДАЛЕНИЕ ПРОЕКТА
========================= */

function deleteProject(id) {

    const p = getProject(id);

    if (
        Number(p.available || 0) > 0.00000001 ||
        Number(p.invested || 0) > 0.00000001
    ) {
        alert(
            "Нельзя удалить проект, пока в нём есть средства.\n\n" +
            `Доступно: ${money(p.available)}\n` +
            `Инвестировано: ${money(p.invested)}`
        );
        return;
    }

    if (!confirm(
        `Удалить проект "${p.name}"?\n\n` +
        `Это нельзя будет отменить.`
    )) {
        return;
    }

    /*
       Если на проект ссылаются поступления,
       удаление проекта оставит эти старые распределения
       без проекта. Поэтому сначала предупреждаем.
    */
    const linkedDeposits = data.deposits.filter(d =>
        Array.isArray(d.allocations) &&
        d.allocations.some(a => a.projectId === id)
    );

    if (linkedDeposits.length) {

        alert(
            "Нельзя удалить проект, потому что с ним связаны " +
            "существующие поступления.\n\n" +
            "Сначала измени/удали связанные поступления."
        );

        return;
    }

    data.projects = data.projects.filter(x => x.id !== id);

    addHistory(
        "project",
        `Удалён проект: ${p.name}`
    );

    save();
    render();
}

/* =========================
   MODAL
========================= */

function openModal() {
    document.getElementById("modal").classList.remove("hidden");
}

function closeModal() {
    document.getElementById("modal").classList.add("hidden");
}

/* =========================
   БЕЗОПАСНЫЙ HTML
========================= */

function escapeHtml(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function escapeAttr(text) {
    return escapeHtml(text);
}

/* =========================
   ОБНОВЛЕНИЕ ЭКРАНА
========================= */

function render() {
    renderFund();
    renderDeposits();
    renderProjects();
    renderWithdrawals();
    renderHistory();
}

render();

</script>
